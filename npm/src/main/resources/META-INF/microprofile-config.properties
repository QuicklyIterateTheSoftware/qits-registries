# Defaults this library jar ships (ordinal 100). The consuming service or its environment overrides
# any of them. Only the npm registry's own knobs are here — no datasource, no persistence unit and
# no Flyway keys: the service that owns the tables carries those.

# The publish ceiling. A tarball arrives base64-inflated inside a publish document, so this bounds
# the document too; it must stay well under the app's quarkus.http.limits.max-body-size.
qits.artifacts.npm.max-publish-size=32M

# What NPM_PROXY caches, and how long a packument stands before it is revalidated. A version's
# tarball is immutable and never revalidated; only the document mutates.
qits.artifacts.npm.proxy.upstream=https://registry.npmjs.org
qits.artifacts.npm.proxy.packument-ttl=PT5M

# TEST-ONLY. The lib ships no datasource, so the suite supplies two: the JPA entities on in-memory
# H2 on the DEFAULT datasource and the default persistence unit, which picks up every indexed
# entity — this module's and qits-blobstore's — and the blob tables on real postgres, on a named
# datasource of their own.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:registries-npm;DB_CLOSE_DELAY=-1

# The schema comes from the entities, not from Flyway: a lib carries no migrations.
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# The blob tables: REAL postgres, because that is the only engine the blob store has — advisory
# locks, bytea, a partial index and an on-conflict promote exist on no other. The url and
# credentials come from EmbeddedPgConfigSource, which starts the server and applies
# qits-blobstore's own db/blobstore-tables.sql; the datasource is deliberately NOT the default one,
# so the by-name lookup every consuming service relies on is exercised rather than assumed.
quarkus.datasource.blobs.db-kind=postgresql
qits.artifacts.blobs-datasource=blobs

# Small chunks, so the suite's kilobyte fixtures cross chunk boundaries on both the write and the
# serve path. Every read is arithmetic on the recorded chunk size, so exercising it at 4 KiB
# exercises it at 1 MiB without moving megabytes to reach the second chunk.
qits.artifacts.blob-chunk-size=4096

# Port 8081 is the platform npm registry on the build hosts, so never bind a fixed port.
quarkus.http.test-port=0

# The publish ceiling is a fraction of the body ceiling in a real deployment; the suite needs the
# body ceiling to be the larger of the two or the cap case measures the wrong limit.
quarkus.http.limits.max-body-size=64M

# No network in the suite. A closed port refuses at once instead of costing a DNS timeout; the
# proxy cases override this per-profile with an in-process stub registry (npm/StubNpmRegistry).
qits.artifacts.npm.proxy.upstream=http://localhost:1

# TEST-ONLY. See the npm module's twin for the shape and the reasons.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:registries-maven;DB_CLOSE_DELAY=-1

quarkus.hibernate-orm.schema-management.strategy=drop-and-create

qits.artifacts.blobs-dir=target/maven-test-blobs

quarkus.http.test-port=0
quarkus.http.limits.max-body-size=192M

# No network in the suite. The proxy cases override this per-profile with an in-process stub
# repository (maven/StubMavenRepository).
qits.artifacts.maven.proxy.upstream=http://localhost:1

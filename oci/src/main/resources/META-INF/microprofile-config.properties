# Defaults this library jar ships (ordinal 100). The consuming service or its environment overrides
# any of them. Only the registry's own knobs are here — no datasource, no persistence unit and no
# Flyway keys: the service that owns the tables carries those.
#
# quarkus.http.limits.max-body-size is deliberately NOT here although the layer cap below has to sit
# under it: that ceiling is the whole application's, not this format's, so the deployable sets it.

qits.artifacts.oci.max-layer-size=1G
qits.artifacts.oci.max-manifest-size=4M

# An upload session that nothing has PATCHed for this long is dropped; a per-chunk idle wait bounds
# a stalled client without cutting off a slow but progressing one.
qits.artifacts.oci.upload-session-ttl=PT30M
qits.artifacts.oci.upload-idle-timeout=PT1M

# OCI_MIRROR: how long a resolved tag stands before the upstream is asked again, and the two
# timeouts that separate a manifest HEAD from a layer pull.
qits.artifacts.oci.mirror.tag-ttl=PT1H
qits.artifacts.oci.mirror.manifest-timeout=PT30S
qits.artifacts.oci.mirror.blob-timeout=PT10M

# Empty means "use each upstream's real endpoint". A test or an air-gapped deployment points this at
# a stub instead; it is the one switch that stops a cold miss dialling a public registry.
qits.artifacts.oci.mirror.endpoint-override=

# TEST-ONLY. See the npm module's twin for the shape and the reasons.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:registries-oci;DB_CLOSE_DELAY=-1

quarkus.hibernate-orm.schema-management.strategy=drop-and-create

qits.artifacts.blobs-dir=target/oci-test-blobs

quarkus.http.test-port=0

# The body ceiling the layer cap has to sit under. A deployment sets this an order of magnitude
# higher; here it only has to exceed the caps the suite exercises.
quarkus.http.limits.max-body-size=64M
qits.artifacts.oci.max-layer-size=32M

# The mirror's upstreams are REAL public registries, so without this a cold miss would dial quay.io
# or Docker Hub for real. A closed port refuses at once, which is the honest offline posture; the
# suites that exercise the miss path override it per-profile with registry/StubOciRegistry.
qits.artifacts.oci.mirror.endpoint-override=http://localhost:1
